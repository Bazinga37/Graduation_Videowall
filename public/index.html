<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promocija FER – Pojavi se na zidu</title>
<style>
  :root { --bg: #f5f6fa; --fg: #111; --accent: #e30613; --ok: #1a7f37; --err: #c62828; --font: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font-family: var(--font); padding: 24px; }
  .card { width: 100%; max-width: 380px; background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .card__title { margin: 0 0 8px; font-size: 22px; }
  .card__text { margin: 0 0 20px; color: #555; }
  .form__input { width: 100%; font-size: 24px; letter-spacing: 3px; text-align: center; padding: 14px; border: 2px solid #ddd; border-radius: 10px; }
  .form__input:focus { outline: none; border-color: var(--accent); }
  .form__btn { width: 100%; margin-top: 14px; padding: 14px; font-size: 18px; font-weight: 600; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
  .form__btn:disabled { opacity: .5; }
  .msg { margin-top: 16px; min-height: 1.4em; text-align: center; }
  .msg--ok { color: var(--ok); } .msg--err { color: var(--err); }
</style>
</head>
<body>
  <main class="card">
    <h1 class="card__title">Čestitamo! 🎓</h1>
    <p class="card__text">Upiši svoj JMBAG i pogledaj videozid.</p>
    <form id="form">
      <input id="jmbag" class="form__input" inputmode="numeric" pattern="\d{10}" maxlength="10"
             placeholder="0036xxxxxx" autocomplete="off" required>
      <button id="btn" class="form__btn" type="submit">Prikaži me</button>
    </form>
    <p id="msg" class="msg"></p>
  </main>

<script>
  const form = document.getElementById('form'), input = document.getElementById('jmbag');
  const btn = document.getElementById('btn'), msg = document.getElementById('msg');

  input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, '').slice(0, 10); });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Šaljem...';
    try {
      const r = await fetch('/api/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jmbag: input.value }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.message || 'Greška');
      msg.className = 'msg msg--ok';
      msg.textContent = data.position === 0
        ? `${data.ime}, pogledaj zid – sad si ti na redu!`
        : `${data.ime}, u redu si (${data.position}. po redu). Prati zid!`;
      input.value = '';
    } catch (err) {
      msg.className = 'msg msg--err'; msg.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
