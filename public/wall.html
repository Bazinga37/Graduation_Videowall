<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Videozid – Promocija FER</title>
    <style>
      /* === Dizajner: mijenjaj varijable i klase, JS ovisi samo o id-evima === */
      :root {
        --bg: #0b1020;
        --fg: #ffffff;
        --accent: #e30613;
        --muted: #a8b0c4;
        --font: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        overflow: hidden;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
        transition: opacity 0.6s;
      }
      .hidden {
        opacity: 0;
        pointer-events: none;
      }

      .idle__title {
        font-size: 5vh;
        font-weight: 700;
      }
      .idle__qr {
        width: 45vh;
        height: 45vh;
        background: #fff;
        padding: 2vh;
        border-radius: 2vh;
      }
      .idle__hint {
        font-size: 3vh;
        color: var(--muted);
      }

      .student__photo {
        height: 52vh;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border-radius: 2vh;
        border: 0.6vh solid var(--accent);
      }
      .student__name {
        font-size: 7vh;
        font-weight: 800;
        text-align: center;
      }
      .student__naslov {
        font-size: 3.6vh;
        font-style: italic;
        text-align: center;
        max-width: 80vw;
      }
      .student__mentor {
        font-size: 3vh;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <section id="idle" class="screen">
      <h1 class="idle__title">Promocija prvostupnika FER-a</h1>
      <img id="qr" class="idle__qr" src="/api/qr.svg" alt="QR kod" />
      <p class="idle__hint">Skeniraj QR, upiši JMBAG i pojavi se na zidu!</p>
    </section>

    <section id="student" class="screen hidden">
      <img id="photo" class="student__photo" alt="" />
      <h2 id="name" class="student__name" aria-live="polite">&nbsp;</h2>
      <p id="naslov" class="student__naslov"></p>
      <p id="mentor" class="student__mentor"></p>
    </section>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const socket = io();

      function showIdle() {
        $("student").classList.add("hidden");
        $("idle").classList.remove("hidden");
      }

      function showStudent(s) {
        const img = new Image();
        img.onload = img.onerror = () => {
          // pričekaj sliku da nema "praznog" frejma
          $("photo").src = img.src;
          $("name").textContent = `${s.ime} ${s.prezime}`;
          $("naslov").textContent = s.naslovRada ? `„${s.naslovRada}”` : "";
          $("mentor").textContent = s.mentor ? `Mentor: ${s.mentor}` : "";
          $("idle").classList.add("hidden");
          $("student").classList.remove("hidden");
        };
        img.src = s.photoUrl;
      }

      socket.on("show", showStudent);
      socket.on("idle", showIdle);
      socket.on("disconnect", showIdle);
    </script>
  </body>
</html>
